<!DOCTYPE html>
<html lang="uz">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🃏 FlashCard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ═══════════════════════════════════════════
   RESET & ROOT
═══════════════════════════════════════════ */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg:       var(--tg-theme-bg-color, #0f0f1a);
  --bg2:      var(--tg-theme-secondary-bg-color, #1a1a2e);
  --text:     var(--tg-theme-text-color, #e8e8f0);
  --hint:     var(--tg-theme-hint-color, #888899);
  --btn:      var(--tg-theme-button-color, #6c63ff);
  --btn-text: var(--tg-theme-button-text-color, #ffffff);
  --accent:   #6c63ff;
  --green:    #4ade80;
  --red:      #f87171;
  --yellow:   #fbbf24;
  --radius:   18px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ═══════════════════════════════════════════
   SCREENS
═══════════════════════════════════════════ */
.screen { display: none; min-height: 100vh; padding: 16px; animation: fadeIn .25s ease; }
.screen.active { display: flex; flex-direction: column; }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }

/* ═══════════════════════════════════════════
   HEADER
═══════════════════════════════════════════ */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  background: var(--bg2);
  border-radius: var(--radius);
  margin-bottom: 16px;
}
.header-title { font-size: 18px; font-weight: 700; }
.streak-badge {
  display: flex; align-items: center; gap: 5px;
  background: linear-gradient(135deg,#ff6b35,#ff9500);
  padding: 6px 12px; border-radius: 20px;
  font-weight: 700; font-size: 13px; color: #fff;
}

/* ═══════════════════════════════════════════
   DECK GRID (HOME)
═══════════════════════════════════════════ */
.deck-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.deck-card {
  background: var(--bg2);
  border-radius: var(--radius);
  padding: 18px 14px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all .2s;
  position: relative;
  overflow: hidden;
}
.deck-card::before {
  content: '';
  position: absolute; top:0; left:0; right:0; height:3px;
  background: var(--accent);
  border-radius: 3px 3px 0 0;
}
.deck-card:active { transform: scale(.97); border-color: var(--accent); }
.deck-emoji { font-size: 28px; margin-bottom: 8px; }
.deck-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.deck-count { font-size: 11px; color: var(--hint); }
.deck-progress-bar {
  height: 3px; background: rgba(108,99,255,.2);
  border-radius: 3px; margin-top: 10px; overflow: hidden;
}
.deck-progress-fill { height:100%; background: var(--accent); border-radius: 3px; transition: width .4s; }

.btn-add-deck {
  grid-column: span 2;
  background: rgba(108,99,255,.12);
  border: 2px dashed rgba(108,99,255,.4);
  color: var(--accent);
  border-radius: var(--radius);
  padding: 16px;
  font-size: 14px; font-weight: 600;
  cursor: pointer; text-align: center;
  transition: all .2s;
}
.btn-add-deck:active { background: rgba(108,99,255,.2); }

/* Stats row */
.stats-row {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 10px;
  margin-bottom: 16px;
}
.stat-box {
  background: var(--bg2); border-radius: var(--radius);
  padding: 14px 10px; text-align: center;
}
.stat-val { font-size: 22px; font-weight: 700; color: var(--accent); }
.stat-lbl { font-size: 10px; color: var(--hint); margin-top: 2px; }

/* ═══════════════════════════════════════════
   FLASHCARD (STUDY SCREEN)
═══════════════════════════════════════════ */
#studyScreen { justify-content: flex-start; }

.study-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
}
.btn-back {
  background: var(--bg2); border: none; color: var(--text);
  width: 36px; height: 36px; border-radius: 12px;
  font-size: 18px; cursor: pointer; display: flex; align-items:center; justify-content:center;
}
.study-title { font-size: 16px; font-weight: 600; flex:1; }
.study-counter { font-size: 13px; color: var(--hint); }

/* Progress */
.study-progress { margin-bottom: 20px; }
.progress-bar { height: 6px; background: var(--bg2); border-radius:10px; overflow:hidden; }
.progress-fill {
  height:100%; background: linear-gradient(90deg,var(--accent),#a78bfa);
  border-radius:10px; transition: width .4s ease;
}

/* 3D FLIP CARD */
.card-scene {
  perspective: 1000px;
  margin-bottom: 24px;
  flex-shrink: 0;
}
.card-wrap {
  position: relative;
  width: 100%; padding-top: 56%;
  transform-style: preserve-3d;
  transition: transform .6s cubic-bezier(.4,0,.2,1);
  cursor: pointer;
}
.card-wrap.flipped { transform: rotateY(180deg); }

.card-face {
  position: absolute; inset: 0;
  border-radius: var(--radius);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  user-select: none;
}
.card-front {
  background: linear-gradient(135deg, #1e1b4b, #312e81);
  border: 2px solid rgba(108,99,255,.4);
}
.card-back {
  background: linear-gradient(135deg, #064e3b, #065f46);
  border: 2px solid rgba(74,222,128,.4);
  transform: rotateY(180deg);
}
.card-label {
  font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
  color: rgba(255,255,255,.5); margin-bottom: 12px; font-weight: 600;
}
.card-word {
  font-size: clamp(22px, 6vw, 32px);
  font-weight: 700; text-align: center; line-height: 1.3;
}
.card-hint-text {
  font-size: 13px; color: rgba(255,255,255,.6);
  margin-top: 10px; text-align: center; font-style: italic;
}
.card-tap-hint {
  position: absolute; bottom: 14px;
  font-size: 11px; color: rgba(255,255,255,.35);
  display: flex; align-items: center; gap: 4px;
}

/* Rating buttons */
.rating-buttons {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 10px;
  margin-bottom: 16px;
}
.rating-btn {
  border: none; border-radius: var(--radius);
  padding: 14px 8px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .15s;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.rating-btn:active { transform: scale(.96); }
.rating-btn .rb-emoji { font-size: 20px; }
.rating-btn.hard { background: rgba(248,113,113,.15); color: var(--red); border: 1.5px solid rgba(248,113,113,.3); }
.rating-btn.ok   { background: rgba(251,191,36,.15); color: var(--yellow); border: 1.5px solid rgba(251,191,36,.3); }
.rating-btn.easy { background: rgba(74,222,128,.15); color: var(--green); border: 1.5px solid rgba(74,222,128,.3); }

.flip-prompt {
  text-align: center; color: var(--hint); font-size: 13px;
  padding: 16px; animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }

/* ═══════════════════════════════════════════
   ADD CARD SCREEN
═══════════════════════════════════════════ */
.form-group { margin-bottom: 14px; }
.form-label { font-size: 12px; color: var(--hint); font-weight:600; letter-spacing:.5px; margin-bottom: 6px; display:block; }
.form-input, .form-select, .form-textarea {
  width: 100%; background: var(--bg2); border: 1.5px solid rgba(108,99,255,.2);
  color: var(--text); border-radius: 12px; padding: 12px 14px;
  font-size: 15px; outline: none; transition: border-color .2s;
  font-family: inherit;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--accent);
}
.form-textarea { resize: none; height: 70px; }
.form-select option { background: #1a1a2e; }

/* ═══════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════ */
.btn {
  width: 100%; padding: 15px; border: none; border-radius: var(--radius);
  font-size: 15px; font-weight: 700; cursor: pointer; transition: all .15s;
  font-family: inherit;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:active { transform: scale(.98); background: #5b52e0; }
.btn-secondary {
  background: var(--bg2); color: var(--text);
  border: 1.5px solid rgba(108,99,255,.2);
  margin-top: 10px;
}
.btn-secondary:active { transform: scale(.98); }

/* ═══════════════════════════════════════════
   COMPLETE SCREEN
═══════════════════════════════════════════ */
.complete-wrap {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 24px; text-align: center;
}
.complete-emoji { font-size: 72px; margin-bottom: 16px; animation: bounce .6s ease; }
@keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
.complete-title { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
.complete-sub { font-size: 14px; color: var(--hint); margin-bottom: 28px; line-height: 1.6; }
.session-stats {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 10px;
  width: 100%; margin-bottom: 28px;
}
.session-stat { background: var(--bg2); border-radius: var(--radius); padding: 14px 8px; }
.ss-val { font-size: 24px; font-weight: 700; }
.ss-lbl { font-size: 10px; color: var(--hint); margin-top: 3px; }

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: rgba(30,27,75,.95); color:#fff;
  padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight:600;
  transition: transform .3s; z-index: 999; white-space: nowrap;
  backdrop-filter: blur(10px); border: 1px solid rgba(108,99,255,.3);
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* Tabs */
.tabs { display:flex; gap:8px; margin-bottom:16px; }
.tab {
  flex:1; padding:10px; border-radius:12px; border:none;
  font-size:13px; font-weight:600; cursor:pointer;
  background: var(--bg2); color: var(--hint); transition:.2s;
}
.tab.active { background: var(--accent); color:#fff; }
</style>

/* ── Spaced Repetition (SM-2 simplified) ─── */
function getNextInterval(card, quality) {
  // quality: 1=hard, 3=ok, 5=easy
  if (!card.interval) card.interval = 1;
  if (!card.easeFactor) card.easeFactor = 2.5;
  if (!card.repetitions) card.repetitions = 0;

  if (quality >= 3) {
    if (card.repetitions === 0) card.interval = 1;
    else if (card.repetitions === 1) card.interval = 6;
    else card.interval = Math.round(card.interval * card.easeFactor);
    card.repetitions++;
  } else {
    card.repetitions = 0;
    card.interval = 1;
  }

  card.easeFactor = Math.max(1.3,
    card.easeFactor + 0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)
  );

  const nextDate = new Date();
  nextDate.setDate(nextDate.getDate() + card.interval);
  card.nextReview = nextDate.toISOString().split('T')[0];
  card.lastQuality = quality;
  return card;
}

function isDue(card) {
  if (!card.nextReview) return true;
  return card.nextReview <= new Date().toISOString().split('T')[0];
}

/* ── State ───────────────────────────────── */
let db = loadDB();
let currentDeck = null;
let studyQueue = [];
let studyIdx = 0;
let isFlipped = false;
let sessionStats = { easy:0, ok:0, hard:0 };

/* ── Screen Nav ──────────────────────────── */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'homeScreen') renderHome();
}

/* ── Render Home ─────────────────────────── */
function renderHome() {
  updateStreak();
  const grid = document.getElementById('deckGrid');

  // Count stats
  let total = 0, learned = 0;
  db.decks.forEach(d => {
    total += d.cards.length;
    learned += d.cards.filter(c => c.repetitions > 0).length;
  });

  document.getElementById('totalCards').textContent = total;
  document.getElementById('learnedCards').textContent = learned;
  document.getElementById('todayCards').textContent = db.todayCount || 0;
  document.getElementById('streakCount').textContent = db.streak || 0;

  // Render deck cards
  grid.innerHTML = '';
  db.decks.forEach(deck => {
    const due = deck.cards.filter(isDue).length;
    const learned = deck.cards.filter(c => c.repetitions > 0).length;
    const pct = deck.cards.length ? Math.round(learned / deck.cards.length * 100) : 0;

    const card = document.createElement('div');
    card.className = 'deck-card';
    card.innerHTML = `
      <div class="deck-emoji">${deck.emoji || '🃏'}</div>
      <div class="deck-name">${deck.name}</div>
      <div class="deck-count">${deck.cards.length} karta · ${due > 0 ? `<span style="color:var(--accent)">${due} bugun</span>` : '✅ tayyor'}</div>
      <div class="deck-progress-bar"><div class="deck-progress-fill" style="width:${pct}%"></div></div>
    `;
    card.onclick = () => startStudy(deck.id);
    grid.appendChild(card);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'btn-add-deck';
  addBtn.innerHTML = '➕ Yangi to\'plam yaratish';
  addBtn.onclick = () => showScreen('addDeckScreen');
  grid.appendChild(addBtn);
}

/* ── Streak ──────────────────────────────── */
function updateStreak() {
  const today = new Date().toISOString().split('T')[0];
  const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];

  if (db.lastStudyDate === today) return;
  if (db.lastStudyDate === yesterday) {
    // streak continues — will be updated on study
  } else if (db.lastStudyDate && db.lastStudyDate < yesterday) {
    db.streak = 0; // streak broken
    saveDB(db);
  }
  if (db.lastStudyDate !== today) {
    db.todayCount = 0;
  }
}

/* ── Start Study ─────────────────────────── */
function startStudy(deckId) {
  currentDeck = db.decks.find(d => d.id === deckId);
  if (!currentDeck) return;

  // Build queue: due cards first, then others (max 20)
  const due = currentDeck.cards.filter(isDue);
  const notDue = currentDeck.cards.filter(c => !isDue(c));
  studyQueue = [...due, ...notDue].slice(0, 20);

  if (!studyQueue.length) {
    showToast('Bu to\'plamda karta yo\'q!'); return;
  }

  studyIdx = 0;
  sessionStats = { easy:0, ok:0, hard:0 };
  document.getElementById('studyTitle').textContent = currentDeck.name;
  showScreen('studyScreen');
  loadCard();
}

function loadCard() {
  if (studyIdx >= studyQueue.length) {
    showComplete(); return;
  }

  const card = studyQueue[studyIdx];
  isFlipped = false;
  document.getElementById('cardWrap').classList.remove('flipped');
  document.getElementById('flipPrompt').style.display = 'block';
  document.getElementById('ratingBtns').style.display = 'none';

  document.getElementById('frontWord').textContent = card.f;
  document.getElementById('frontHint').textContent = card.h || '';
  document.getElementById('backWord').textContent = card.b;
  document.getElementById('backExample').textContent = card.ex || '';

  const pct = Math.round((studyIdx / studyQueue.length) * 100);
  document.getElementById('studyProgress').style.width = pct + '%';
  document.getElementById('studyCounter').textContent = `${studyIdx + 1} / ${studyQueue.length}`;

  tg.HapticFeedback.selectionChanged();
}

function flipCard() {
  const wrap = document.getElementById('cardWrap');
  isFlipped = !isFlipped;
  wrap.classList.toggle('flipped', isFlipped);

  if (isFlipped) {
    document.getElementById('flipPrompt').style.display = 'none';
    document.getElementById('ratingBtns').style.display = 'grid';
    tg.HapticFeedback.impactOccurred('light');
  } else {
    document.getElementById('flipPrompt').style.display = 'block';
    document.getElementById('ratingBtns').style.display = 'none';
  }
}

function rateCard(quality) {
  if (!isFlipped) return;

  const card = studyQueue[studyIdx];

  // Find in deck and update
  const deckCard = currentDeck.cards.find(c => c.f === card.f && c.b === card.b);
  if (deckCard) getNextInterval(deckCard, quality);

  // Session stats
  if (quality === 5) sessionStats.easy++;
  else if (quality === 3) sessionStats.ok++;
  else sessionStats.hard++;

  // DB update
  db.todayCount = (db.todayCount || 0) + 1;
  const today = new Date().toISOString().split('T')[0];
  const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
  if (db.lastStudyDate === yesterday || db.lastStudyDate === today) {
    if (db.lastStudyDate !== today) db.streak = (db.streak || 0) + 1;
  } else {
    db.streak = 1;
  }
  db.lastStudyDate = today;
  db.totalLearned = (db.totalLearned || 0) + 1;
  saveDB(db);

  tg.HapticFeedback.impactOccurred(quality === 5 ? 'medium' : quality === 3 ? 'light' : 'rigid');

  studyIdx++;
  setTimeout(loadCard, 150);
}

/* ── Complete ────────────────────────────── */
function showComplete() {
  document.getElementById('easyCount').textContent = sessionStats.easy;
  document.getElementById('okCount').textContent = sessionStats.ok;
  document.getElementById('hardCount').textContent = sessionStats.hard;

  const total = sessionStats.easy + sessionStats.ok + sessionStats.hard;
  const pct = total ? Math.round(sessionStats.easy / total * 100) : 0;

  let emoji = '🎉', title = 'Ajoyib!';
  if (pct >= 80) { emoji = '🏆'; title = 'Zo\'r natija!'; }
  else if (pct >= 50) { emoji = '💪'; title = 'Yaxshi ish!'; }
  else { emoji = '📚'; title = 'Davom eting!'; }

  document.getElementById('completeEmoji').textContent = emoji;
  document.getElementById('completeTitle').textContent = title;
  document.getElementById('completeSub').textContent =
    `${total} ta karta ko'rildi · 🔥 ${db.streak} kunlik streak`;

  showScreen('completeScreen');
  tg.HapticFeedback.notificationOccurred('success');
}

function restartStudy() {
  if (currentDeck) startStudy(currentDeck.id);
}

/* ── Add Deck Tabs ───────────────────────── */
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i === (tab==='preset'?0:1)));
  document.getElementById('presetTab').style.display = tab === 'preset' ? 'block' : 'none';
  document.getElementById('customTab').style.display = tab === 'custom' ? 'block' : 'none';

  if (tab === 'preset') renderPresets();
  else if (!document.getElementById('cardRows').children.length) { addCardRow(); addCardRow(); }
}

function renderPresets() {
  const grid = document.getElementById('presetGrid');
  grid.innerHTML = '';
  PRESET_DECKS.forEach(pd => {
    const already = db.decks.find(d => d.id === pd.id);
    const card = document.createElement('div');
    card.className = 'deck-card';
    card.style.cursor = already ? 'default' : 'pointer';
    card.innerHTML = `
      <div class="deck-emoji">${pd.emoji}</div>
      <div class="deck-name">${pd.name}</div>
      <div class="deck-count">${pd.cards.length} karta</div>
      <div style="margin-top:10px;font-size:12px;font-weight:600;color:${already?'var(--green)':'var(--accent)'}">
        ${already ? '✅ Qo\'shilgan' : '+ Qo\'shish'}
      </div>
    `;
    if (!already) card.onclick = () => addPresetDeck(pd);
    grid.appendChild(card);
  });
}

function addPresetDeck(pd) {
  db.decks.push({ ...pd, cards: pd.cards.map(c => ({...c})) });
  saveDB(db);
  showToast(`✅ "${pd.name}" qo'shildi!`);
  renderPresets();
}

/* ── Custom Deck ─────────────────────────── */
function addCardRow() {
  const container = document.getElementById('cardRows');
  const row = document.createElement('div');
  row.style.cssText = 'display:grid;grid-template-columns:1fr 1fr 28px;gap:8px;margin-bottom:8px;align-items:center;';
  row.innerHTML = `
    <input class="form-input card-front-input" placeholder="So'z / ibora" style="padding:10px 12px;font-size:14px">
    <input class="form-input card-back-input" placeholder="Tarjimasi" style="padding:10px 12px;font-size:14px">
    <button onclick="this.parentElement.remove()" style="background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.3);border-radius:10px;width:28px;height:28px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center">×</button>
  `;
  container.appendChild(row);
}

function saveCustomDeck() {
  const name = document.getElementById('deckNameInput').value.trim();
  const emoji = document.getElementById('deckEmojiInput').value.trim() || '🃏';
  if (!name) { showToast('❗ To\'plam nomini kiriting!'); return; }

  const cards = [];
  document.querySelectorAll('#cardRows > div').forEach(row => {
    const f = row.querySelector('.card-front-input').value.trim();
    const b = row.querySelector('.card-back-input').value.trim();
    if (f && b) cards.push({ f, b });
  });

  if (!cards.length) { showToast('❗ Kamida 1 ta karta kiriting!'); return; }

  db.decks.push({
    id: 'custom_' + Date.now(),
    name, emoji, cards
  });
  saveDB(db);
  showToast(`✅ "${name}" saqlandi! (${cards.length} karta)`);
  setTimeout(() => showScreen('homeScreen'), 500);
}

/* ── Toast ───────────────────────────────── */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

/* ── Init ────────────────────────────────── */
function init() {
  // Auto-add EN-UZ deck for first timers
  if (!db.decks.length) {
    const eng = PRESET_DECKS[0];
    db.decks.push({ ...eng, cards: eng.cards.map(c => ({...c})) });
    saveDB(db);
  }
  renderHome();
  renderPresets();
}

init();
</script>
